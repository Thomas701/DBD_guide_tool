name: Vérifier la base Supabase
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbd_test
          POSTGRES_PASSWORD: dbd_test
          POSTGRES_DB: dbd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbd_test -d dbd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les accès, les conflits et la révocation des collecteurs
        env:
          PGPASSWORD: dbd_test
        run: |
          psql -h 127.0.0.1 -U dbd_test -d dbd_test -v ON_ERROR_STOP=1 \
            -f tests/database/bootstrap.sql \
            -f supabase/migrations/202611210001_accounts_and_statistics.sql \
            -f tests/database/remote-bootstrap.sql \
            -f supabase/migrations/202611220002_remote_statistics.sql \
            -f supabase/migrations/202611220003_administrators.sql \
            -f supabase/migrations/202611220004_server_statistics_ingestion.sql \
            -f supabase/migrations/202611220005_community_and_administration.sql \
            -f supabase/migrations/202611220006_behaviour_nickname.sql \
            -f supabase/migrations/202611230001_community_profiles_and_consultants.sql \
            -f supabase/migrations/202611240001_admin_mmr.sql \
            -f supabase/migrations/202611260001_terrifier_perk_names.sql \
            -f supabase/migrations/202611260002_mmr_survivor_outcomes.sql \
            -f tests/database/accounts.sql \
            -f tests/database/administrators.sql \
            -f tests/database/community.sql \
            -f tests/database/behaviour-nickname.sql \
            -f tests/database/community-profiles.sql \
            -f tests/database/terrifier.sql \
            -f tests/database/remote-statistics.sql
